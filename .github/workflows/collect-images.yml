name: Collect Images

on:
  workflow_dispatch:
    inputs:
      # BEGIN dispatch-defaults (generated by hack/scripts/sync-dispatch-defaults.sh from default-tags.env)
      appscode_cloud_tag:
        description: 'appscode-cloud/installer tag (also names the output dir)'
        required: true
        default: 'v2026.6.19'
      kubedb_tag:
        description: 'kubedb/installer tag'
        required: true
        default: 'v2026.6.19'
      kubestash_tag:
        description: 'kubestash/installer tag'
        required: true
        default: 'v2026.6.19'
      kubeops_tag:
        description: 'kubeops/installer tag'
        required: true
        default: 'v2026.6.19'
      kluster_manager_tag:
        description: 'kluster-manager/installer tag'
        required: true
        default: 'v2026.6.26'
      open_viz_tag:
        description: 'open-viz/installer tag'
        required: true
        default: 'v2026.6.12'
      # END dispatch-defaults

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.appscode_cloud_tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
          cache: false

      - name: Prepare host
        run: |
          # install yq (v3 shim used by the installer repos)
          curl -fsSL -o yqq https://github.com/mikefarah/yq/releases/download/3.3.0/yq_linux_amd64
          chmod +x yqq
          sudo mv yqq /usr/local/bin/yqq
          pipx install yq
          # install x-helm build of helm 3
          pushd /usr/local/bin && sudo curl -fsSLO https://github.com/x-helm/helm/releases/latest/download/helm && sudo chmod +x helm && popd

      # Scaffolded for future use (image verification / scanning). Not consumed
      # by image-list collection yet.
      - name: Create Kubernetes cluster
        id: kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0

      - name: Collect image lists
        env:
          APPSCODE_CLOUD_TAG: ${{ github.event.inputs.appscode_cloud_tag }}
          KUBEDB_TAG: ${{ github.event.inputs.kubedb_tag }}
          KUBESTASH_TAG: ${{ github.event.inputs.kubestash_tag }}
          KUBEOPS_TAG: ${{ github.event.inputs.kubeops_tag }}
          KLUSTER_MANAGER_TAG: ${{ github.event.inputs.kluster_manager_tag }}
          OPEN_VIZ_TAG: ${{ github.event.inputs.open_viz_tag }}
        run: ./hack/scripts/collect-images.sh

      - name: Push image lists to tag branch
        env:
          TAG: ${{ github.event.inputs.appscode_cloud_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "${TAG}"
          git add "${TAG}"
          git commit -s -m "Collect images for ${TAG}"
          git push --force origin "${TAG}"
